<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<title>Prueba de la malla de voz</title>
	</head>
	<body>
		<div id="root">midiendo…</div>
		<script>
			// Micrófono y pantalla falsos: acá se prueba la NEGOCIACIÓN, no la captura.
			// (El micrófono es un audio de verdad, así se verifica que la voz llegue.)
			const contexto = new AudioContext();
			const destino = contexto.createMediaStreamDestination();
			const oscilador = contexto.createOscillator();
			oscilador.connect(destino);
			oscilador.start();
			Object.defineProperty(navigator.mediaDevices, 'getUserMedia', {
				value: async () => destino.stream,
			});
			Object.defineProperty(navigator.mediaDevices, 'getDisplayMedia', {
				value: async () => {
					const canvas = document.createElement('canvas');
					canvas.width = 32;
					canvas.height = 32;
					const contexto = canvas.getContext('2d');
					// Se dibuja algo en movimiento: si el canvas no cambia, no se producen cuadros y la
					// pista queda muteada (y la prueba diría que no llega el video).
					let tono = 0;
					setInterval(() => {
						tono = (tono + 30) % 360;
						if (contexto) {
							contexto.fillStyle = `hsl(${tono}, 70%, 50%)`;
							contexto.fillRect(0, 0, 32, 32);
						}
					}, 100);
					return canvas.captureStream(10);
				},
			});
			window.__errores = [];
			window.addEventListener('unhandledrejection', (event) => window.__errores.push('rejection: ' + String(event.reason)));
			window.addEventListener('error', (event) => window.__errores.push('error: ' + event.message));
		</script>
		<script type="module" src="/tests/mesh-test-entry.tsx"></script>
	</body>
</html>
